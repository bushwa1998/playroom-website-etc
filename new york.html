<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New York is</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playwrite+PL:wght@100..400&display=swap');
    body {
            font-family: 'Playwrite Polska', cursive;
            background-color: #f8f8f8;
            margin: 0;
            padding: 20px;
            height: 100vh;
            overflow: hidden;
            cursor: crosshair;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        #drawingCanvas {
            border: 2px solid #ddd;
            background: white;
            display: block;
            margin: 0 auto;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        
        #randomText {
            font-size: 24px;
            line-height: 1.6;
            color: #333;
            text-align: center;
            margin: 20px 0;
            min-height: 60px;
            padding: 20px;
            font-weight: bold;
        }
        
        #instructions {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 18px;
        }
        
        .fade-in {
            animation: fadeIn 0.8s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        #clearBtn {
            display: block;
            margin: 10px auto;
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Playwrite Polska', cursive;
        }
        
        #clearBtn:hover {
            background-color: #545b62;
        }
    </style>
</head>
<body>
    <h1>New York is</h1>
    <div id="instructions">Draw on the canvas to reveal what New York is...</div>
    
    <canvas id="drawingCanvas" width="800" height="400"></canvas>
    <button id="clearBtn">Clear Canvas</button>
    
    <div id="randomText"></div>

    <script>
        // Database of "New York is..." completions
        const textDatabase = [
            "Where it is said to flow with desire and fame",
            "Where they said the American dream is located",
            "Where people argue all the time but enjoy loneliness at the same time",
            "A place that blew my mind away with craziness and chaos",
            "A place where I learn how to play with shadows and enjoy uncertainty and messiness",
            "A place that has a beautiful cemetery near my apartment",
            "Where the floor shakes when the cars drive over the highway",
            "A place where I first experienced the winter depression",
            "A place where I realize how warm it is in Taiwan",
            "A place where I think about whether I am Asian and why",
            "Where I live, like I’ll be killed or stabbed in the next moment",
            "Where I need to grab as much as fast as I can",
            "where I lay out all my drawings and thinking",
            "Where I find and reveal another piece of self",

        ];

        // Canvas setup
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        const textDisplay = document.getElementById('randomText');
        const clearButton = document.getElementById('clearBtn');
        
        let isDrawing = false;
        let hasDrawn = false;
        let drawingTimer = null;
        let fadeTimer = null;
        let drawingData = null; // Store the drawing to fade it

        // Set up canvas for drawing
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#333';

        // Function to generate random text
        function generateRandomText() {
            if (hasDrawn) return; // Only show once per drawing session
            
            const randomIndex = Math.floor(Math.random() * textDatabase.length);
            const randomText = textDatabase[randomIndex];
            
            textDisplay.classList.remove('fade-in');
            
            setTimeout(() => {
                textDisplay.textContent = randomText;
                textDisplay.classList.add('fade-in');
                hasDrawn = true;
                
                // Start fading the drawing after showing the text
                startFading();
            }, 100);
        }

        // Function to gradually fade the drawing
        function startFading() {
            // Store the current drawing
            drawingData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            let opacity = 1;
            const fadeStep = 1 / (4000 / 50); // Fade over 4 seconds, 50ms intervals
            
            fadeTimer = setInterval(() => {
                opacity -= fadeStep;
                
                if (opacity <= 0) {
                    // Completely clear the canvas
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    clearInterval(fadeTimer);
                    // Reset for next drawing
                    hasDrawn = false;
                    textDisplay.textContent = '';
                    return;
                }
                
                // Clear canvas and redraw with reduced opacity
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.globalAlpha = opacity;
                ctx.putImageData(drawingData, 0, 0);
                ctx.globalAlpha = 1; // Reset for future drawing
            }, 50);
        }

        // Mouse events for desktop
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        // Touch events for mobile
        canvas.addEventListener('touchstart', handleTouch);
        canvas.addEventListener('touchmove', handleTouch);
        canvas.addEventListener('touchend', stopDrawing);

        function startDrawing(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
            
            // Clear any existing timer
            if (drawingTimer) {
                clearTimeout(drawingTimer);
            }
        }

        function draw(e) {
            if (!isDrawing) return;
            
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
            
            // Set timer to show text after user stops drawing for 1 second
            if (drawingTimer) {
                clearTimeout(drawingTimer);
            }
            drawingTimer = setTimeout(() => {
                if (!hasDrawn) {
                    generateRandomText();
                }
            }, 1000);
        }

        function stopDrawing() {
            isDrawing = false;
            ctx.beginPath();
        }

        function handleTouch(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent(e.type === 'touchstart' ? 'mousedown' : 
                                            e.type === 'touchmove' ? 'mousemove' : 'mouseup', {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        }

        // Clear canvas function
        clearButton.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            textDisplay.textContent = '';
            hasDrawn = false;
            if (drawingTimer) {
                clearTimeout(drawingTimer);
            }
            if (fadeTimer) {
                clearInterval(fadeTimer);
            }
        });

        // Resize canvas for mobile
        function resizeCanvas() {
            const container = canvas.parentElement;
            const maxWidth = Math.min(800, window.innerWidth - 40);
            const maxHeight = Math.min(400, window.innerHeight * 0.5);
            
            canvas.width = maxWidth;
            canvas.height = maxHeight;
            
            // Reset drawing styles after resize
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#333';
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas(); // Initial resize
    </script>
</body>
</html>
